<header class="main-header">
  <div class="header-left">
    <button class="menu-toggle" id="menu-toggle-btn" style="display:none" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <img src="/assets/logo-ecole.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
    <div class="header-info">
      <h1 id="header-institution-nom">EduManage</h1>
      <span class="badge badge-info header-badge" id="header-institution-niveau"></span>
    </div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    <button class="theme-toggle" onclick="router.navigate('profil')" title="Profil"><i class="fas fa-user-circle"></i></button>
    <button class="btn-logout" onclick="authService.logout()"><i class="fas fa-sign-out-alt"></i> <span class="hide-mobile">Quitter</span></button>
  </div>
</header>
