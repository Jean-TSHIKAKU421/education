<div class="ui-card">
  <div class="card-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <button class="btn btn-sm btn-ghost" onclick="${onPrevMonth}"><i class="fas fa-chevron-left"></i></button>
      <h4>${mois || 'Janvier'} ${annee || '2024'}</h4>
      <button class="btn btn-sm btn-ghost" onclick="${onNextMonth}"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0.3rem;text-align:center">
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Lun</div>
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Mar</div>
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Mer</div>
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Jeu</div>
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Ven</div>
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Sam</div>
      <div style="font-weight:600;color:var(--text-light);font-size:0.8rem;padding:0.3rem">Dim</div>
      ${jours ? jours.map(j => `<div style="padding:0.5rem;border-radius:6px;${j.statut === 'present' ? 'background:var(--success);color:white' : j.statut === 'absent' ? 'background:var(--danger);color:white' : j.statut === 'retard' ? 'background:var(--warning);color:white' : ''};cursor:${j.onclick ? 'pointer' : 'default'}" onclick="${j.onclick || ''}" title="${j.tooltip || ''}">${j.jour || ''}</div>`).join('') : ''}
    </div>
    <div style="display:flex;gap:1rem;margin-top:1rem;justify-content:center;font-size:0.8rem">
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--success);border-radius:3px;margin-right:0.3rem"></span> Présent</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--danger);border-radius:3px;margin-right:0.3rem"></span> Absent</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--warning);border-radius:3px;margin-right:0.3rem"></span> Retard</span>
    </div>
  </div>
</div>
