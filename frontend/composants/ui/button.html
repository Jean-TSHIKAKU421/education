<button class="btn btn-${type || 'primary'} btn-${size || 'md'} ${fullWidth ? 'btn-full' : ''} ${className || ''}" ${id ? `id="${id}"` : ''} ${disabled ? 'disabled' : ''} ${onclick ? `onclick="${onclick}"` : ''} ${typeBtn ? `type="${typeBtn}"` : 'type="button"'} ${title ? `title="${title}"` : ''} ${form ? `form="${form}"` : ''}>
  ${loading ? '<i class="fas fa-spinner fa-spin"></i> ' : icon && iconPos !== 'right' ? `<i class="fas fa-${icon}"></i> ` : ''}
  <span>${text || 'Button'}</span>
  ${!loading && icon && iconPos === 'right' ? ` <i class="fas fa-${icon}"></i>` : ''}
</button>
