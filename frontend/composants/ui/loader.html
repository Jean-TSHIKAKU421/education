<div style="text-align:center;padding:${padding || '3rem'}">
  <div style="position:relative;width:${size || '60'}px;height:${size || '60'}px;margin:0 auto 1.5rem">
    <div class="spinner" style="position:absolute;inset:0;width:100%;height:100%;border-width:${borderWidth || '3'}px;border-style:solid;border-color:var(--border);border-top-color:var(--primary);border-right-color:var(--info);border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <div class="spinner" style="position:absolute;inset:25%;width:50%;height:50%;border-width:${borderWidth || '3'}px;border-style:solid;border-color:transparent;border-bottom-color:var(--success);border-left-color:var(--warning);border-radius:50%;animation:spin 0.6s linear infinite reverse"></div>
    <div style="position:absolute;inset:42%;width:16%;height:16%;background:var(--primary);border-radius:50%;animation:pulse 1.5s ease-in-out infinite"></div>
  </div>
  ${message ? `<p style="color:var(--text-secondary);font-size:0.9rem;animation:pulse 2s ease-in-out infinite">${message}</p>` : ''}
</div>
