<div class="alert-message ${type || 'info'} ${dismissible ? 'alert-dismissible' : ''}" style="${style || ''}" role="alert">
  <i class="fas fa-${icon || (type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle')}"></i>
  <span>${message || ''}</span>
  ${dismissible ? `<button class="alert-close" onclick="this.parentElement.remove()" aria-label="Fermer"><i class="fas fa-times"></i></button>` : ''}
</div>
