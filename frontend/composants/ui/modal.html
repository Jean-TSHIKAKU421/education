<div class="modal-overlay" id="${id}-overlay" onclick="closeModal('${id}')">
  <div class="modal" id="${id}" style="${size === 'lg' ? 'max-width:700px' : size === 'sm' ? 'max-width:350px' : 'max-width:500px'}" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>${icon ? `<i class="fas fa-${icon}"></i> ` : ''}${title || 'Modal'}</h3>
      ${closeBtn !== false ? `<button class="modal-close" onclick="closeModal('${id}')" aria-label="Fermer"><i class="fas fa-times"></i></button>` : ''}
    </div>
    <div class="modal-body">${content || ''}</div>
    ${footer !== false && (onConfirm || footer) ? `<div class="modal-footer">${footer || `
      <button class="btn btn-ghost" onclick="closeModal('${id}')"><i class="fas fa-times"></i> ${cancelText || 'Annuler'}</button>
      <button class="btn btn-primary" onclick="${onConfirm || ''}"><i class="fas fa-check"></i> ${confirmText || 'Confirmer'}</button>
    `}</div>` : ''}
  </div>
</div>
