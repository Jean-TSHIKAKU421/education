<div class="ui-card ${hoverable ? 'card-hoverable' : ''}" ${onclick ? `onclick="${onclick}" style="cursor:pointer"` : ''} role="region" aria-label="${label || 'Statistique'} : ${value || '0'}${tendance ? ', ' + (tendance > 0 ? 'hausse' : 'baisse') + ' de ' + Math.abs(tendance) + '%' : ''}">
  <div class="card-icon-wrapper" style="background:${iconBg || 'var(--primary)'}"><i class="fas fa-${icon || 'chart-bar'}"></i></div>
  <div class="card-body">
    <div class="card-header">
      <h4 class="card-title" style="font-size:1.5rem">${typeof value === 'number' ? value.toLocaleString('fr-FR') : (value || '0')}</h4>
      ${tendance !== undefined && tendance !== null ? `
        <span style="color:${tendance > 0 ? 'var(--success)' : tendance < 0 ? 'var(--danger)' : 'var(--text-light)'};font-size:0.85rem">
          <i class="fas fa-${tendance > 0 ? 'arrow-up' : tendance < 0 ? 'arrow-down' : 'minus'}"></i> ${Math.abs(tendance)}%
        </span>` : ''}
    </div>
    <p class="card-subtitle">${label || 'Statistique'}</p>
    ${description ? `<p style="font-size:0.8rem;color:var(--text-light);margin-top:0.5rem">${description}</p>` : ''}
  </div>
</div>
