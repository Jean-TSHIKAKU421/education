<div class="ui-card card-hoverable" onclick="${onclick || `router.navigate('eleves/${id}')`}" role="button" aria-label="Voir le profil de ${prenom} ${nom}" tabindex="0" onkeydown="if(event.key==='Enter')this.click()">
  <div style="display:flex;align-items:center;gap:1rem;padding:1.25rem">
    <div style="width:50px;height:50px;border-radius:50%;background:${photo ? `url(${photo}) center/cover` : (couleur || 'var(--primary)')};display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:1.2rem;position:relative;flex-shrink:0">
      ${photo ? '' : (initiales || prenom?.charAt(0) || '?')}
      ${genre === 'M' || genre === 'F' ? `<i class="fas fa-${genre === 'M' ? 'mars' : 'venus'}" style="position:absolute;bottom:-2px;right:-2px;font-size:0.6rem;background:white;color:${genre === 'M' ? '#3498db' : '#e84393'};border-radius:50%;padding:2px" aria-hidden="true"></i>` : ''}
    </div>
    <div style="flex:1;min-width:0">
      <strong style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${prenom || ''} ${nom || ''}</strong>
      <div style="color:var(--text-light);font-size:0.85rem">
        <span><i class="fas fa-id-card"></i> ${matricule || 'N/A'}</span>
        ${classe ? `<span style="margin-left:0.5rem"><i class="fas fa-graduation-cap"></i> ${classe}</span>` : ''}
      </div>
    </div>
    <div style="flex-shrink:0">
      ${statut ? `<span class="badge badge-${statut === 'present' ? 'success' : statut === 'absent' ? 'danger' : statut === 'retard' ? 'warning' : 'info'}" aria-label="Statut : ${statut}"><i class="fas fa-${statut === 'present' ? 'check' : statut === 'absent' ? 'times' : statut === 'retard' ? 'clock' : 'info-circle'}"></i> ${statut}</span>` : ''}
      ${justification ? `<span class="badge badge-info" style="margin-left:0.25rem" title="${justification}"><i class="fas fa-info-circle"></i></span>` : ''}
    </div>
  </div>
</div>
